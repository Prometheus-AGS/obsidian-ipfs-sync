<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control center · searchable settings — IPFS Sync concept</title>
<link rel="stylesheet" href="assets/obsidian-shell.css" />
<style>
  .ob-app.cc { grid-template-columns: var(--ribbon-width) 1fr; }
  .ipfs-sync-cc-main h2 { font-size: var(--font-ui-large); font-weight: var(--font-semibold); margin: 0 0 var(--size-4-1); }
  .ipfs-sync-cc-main .lede { color: var(--text-muted); margin: 0 0 var(--size-4-4); font-size: var(--font-ui-small); }
  .ipfs-sync-grant { display: grid; grid-template-columns: 1fr auto auto; gap: var(--size-4-3); align-items: center; padding: 10px 12px; border-top: 1px solid var(--background-modifier-border); font-size: var(--font-ui-small); }
  .ipfs-sync-grant:first-child { border-top: 0; }
  .ipfs-sync-grant .cap { font-family: var(--font-monospace); font-size: 12px; }
  .ipfs-sync-grant .exp { color: var(--text-muted); font-variant-numeric: tabular-nums; font-family: var(--font-monospace); font-size: 12px; }
  .ipfs-sync-nomatch { padding: var(--size-4-8) 0; color: var(--text-muted); text-align: center; }
  .ipfs-sync-cc-nav .ob-icon { color: inherit; }
</style>
</head>
<body class="theme-light">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

<div class="ob-app cc" data-od-id="obsidian-window">
  <nav class="ob-ribbon" aria-label="Ribbon">
    <button aria-label="Open quick switcher"><svg class="ob-icon"><use href="#i-layers"/></svg></button>
    <button aria-label="Open graph view"><svg class="ob-icon"><use href="#i-hash"/></svg></button>
    <button aria-label="Vault agent"><svg class="ob-icon"><use href="#i-chat"/></svg></button>
    <span class="spacer"></span>
    <button aria-label="Settings" aria-pressed="true"><svg class="ob-icon"><use href="#i-sliders"/></svg></button>
  </nav>
  <main class="ob-main" aria-label="IPFS Sync control center">
    <div class="ob-tabs"><span class="ob-tab" aria-selected="true"><svg class="ob-icon sm"><use href="#i-sliders"/></svg>IPFS Sync control center</span></div>
    <div class="ipfs-sync-cc" data-od-id="control-center">
      <nav class="ipfs-sync-cc-nav" aria-label="Sections" id="nav"></nav>
      <div class="ipfs-sync-cc-main" id="main">
        <div class="wrap">
          <div class="ipfs-sync-cc-search">
            <div class="ipfs-sync-searchbox"><svg class="ob-icon"><use href="#i-search"/></svg><input id="cc-search" type="search" placeholder="Search settings… try “rekey”, “wipe”, “model”, “battery”" aria-label="Search settings" autocomplete="off" /></div>
          </div>
          <div id="sections"></div>
          <p class="ipfs-sync-nomatch" id="nomatch" hidden>No setting matches. Aliases are searched too: try a plainer word.</p>
        </div>
      </div>
    </div>
  </main>
  <footer class="ob-status-bar" aria-label="Status bar"><span>Index 1,204 / 1,218 · local</span><span>Published 11 min ago</span></footer>
</div>

<div class="modal-bg" id="dlg-bg" data-open="false"></div>
<div class="modal" id="dlg" data-open="false" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <div class="dialog" data-od-id="consequence-dialog">
    <h3 id="dlg-title"></h3>
    <p id="dlg-body"></p>
    <ul id="dlg-list"></ul>
    <div class="btns"><button class="ob-btn" id="dlg-cancel">Cancel</button><button class="ob-btn warn" id="dlg-ok"></button></div>
  </div>
</div>
<div class="ipfs-sync-notice" id="notice" role="status" data-open="false" style="position:fixed;top:16px;right:16px;z-index:70;background:var(--background-primary);border:1px solid var(--background-modifier-border);border-radius:8px;padding:8px 12px;display:none;box-shadow:0 6px 24px color-mix(in oklch,var(--mono-100) 18%,transparent)"></div>

<div class="concept-bar" aria-label="Concept controls">
  <span class="label">Concept</span>
  <a href="index.html">Overview</a>
  <a href="agent-panel.html">Agent chat</a>
  <a href="rag-chat.html">Notes chat</a>
  <a href="quick-ask.html">Quick ask</a>
  <button id="theme" aria-pressed="false"><svg class="ob-icon sm"><use href="#i-sun"/></svg>Dark</button>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const icon = (id) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'ob-icon sm'); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.appendChild(u); return s; };
  let nt; const notice = (m) => { const n = $('#notice'); n.textContent = m; n.style.display = 'block'; clearTimeout(nt); nt = setTimeout(() => n.style.display = 'none', 2400); };
  $('#theme').addEventListener('click', (e) => { const dark = !document.body.classList.contains('theme-dark'); document.body.classList.toggle('theme-dark', dark); document.body.classList.toggle('theme-light', !dark); e.currentTarget.setAttribute('aria-pressed', String(dark)); e.currentTarget.lastChild.textContent = dark ? 'Light' : 'Dark'; });

  // controls
  const toggle = (on) => { const t = el('button', 'checkbox-container'); t.setAttribute('role', 'switch'); t.setAttribute('aria-checked', String(on)); t.addEventListener('click', () => t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true'))); return t; };
  const dropdown = (opts, val) => { const s = el('select', 'dropdown'); opts.forEach(o => { const op = el('option', null, o); if (o === val) op.selected = true; s.appendChild(op); }); return s; };
  const text = (v, mono) => { const i = el('input'); i.type = 'text'; i.value = v; if (mono) i.style.fontFamily = 'var(--font-monospace)'; return i; };
  const button = (label, cls, onClick) => { const b = el('button', 'ob-btn' + (cls ? ' ' + cls : ''), label); b.addEventListener('click', onClick); return b; };
  const dialog = (title, body, list, okLabel, done) => { $('#dlg-title').textContent = title; $('#dlg-body').textContent = body; const ul = $('#dlg-list'); ul.replaceChildren(); list.forEach(l => ul.appendChild(el('li', null, l))); const ok = $('#dlg-ok'); ok.textContent = okLabel; ok.onclick = () => { close(); done(); }; $('#dlg').dataset.open = 'true'; $('#dlg-bg').dataset.open = 'true'; $('#dlg-cancel').focus(); };
  const close = () => { $('#dlg').dataset.open = 'false'; $('#dlg-bg').dataset.open = 'false'; };
  $('#dlg-cancel').addEventListener('click', close); $('#dlg-bg').addEventListener('click', close); document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

  const deviceCard = (kind, name, did, last, self) => { const c = el('div', 'ipfs-sync-device'); const ic = el('div'); ic.style.cssText = 'width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--background-primary-alt);border:1px solid var(--background-modifier-border)'; ic.appendChild(icon(kind)); c.appendChild(ic); const info = el('div'); const nm = el('div', null, name + (self ? ' · this device' : '')); nm.style.fontWeight = '500'; info.appendChild(nm); info.appendChild(el('div', 'did', did)); info.appendChild(el('div', 'setting-item-description', last)); c.appendChild(info); if (self) { c.appendChild(el('span', 'ipfs-sync-badge', 'cannot revoke self')); } else { c.appendChild(button('Revoke', 'warn', () => dialog('Revoke ' + name + '?', 'This device loses sync access when its current grant expires. It keeps the notes it already pulled.', ['Grant expires in 19 h 12 min; a revocation record is published with your next publish.', 'The device cannot publish or pull after that. Re-pairing needs a new short code from this device.', 'This does not change the vault passphrase. Rekey separately if the device was lost.'], 'Revoke device', () => { c.remove(); notice(name + ' revoked at next publish'); }))); } return c; };
  const qr = () => { const q = el('div', 'ipfs-sync-qr'); q.setAttribute('aria-label', 'Pairing QR code (sample)'); const seed = 'did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK'; for (let i = 0; i < 81; i++) { const s = el('span'); const code = seed.charCodeAt(i % seed.length) + i * 7; if ((code % 3) === 0) s.classList.add('o'); q.appendChild(s); } return q; };
  const grantRow = (cap, exp, scope) => { const r = el('div', 'ipfs-sync-grant'); const a = el('div'); a.appendChild(el('div', 'cap', cap)); a.appendChild(el('div', 'setting-item-description', scope)); r.appendChild(a); r.appendChild(el('span', 'exp', exp)); r.appendChild(button('Revoke', 'warn', () => dialog('Revoke this grant?', 'The holder keeps access until the invocation it already holds expires (at most 5 minutes). New invocations fail immediately.', ['Capability: ' + cap, 'A revocation is published with your next publish and is read by every device on its next pull.'], 'Revoke grant', () => { r.remove(); notice('Grant revoked'); }))); return r; };

  // sections: id, label, icon, rows [{name, desc, aliases[], control()}]
  const sections = [
    { id: 'sync', label: 'Sync', icon: 'i-refresh', lede: 'Where the vault publishes and how often.', rows: [
      { name: 'Node URL', desc: 'The kubo RPC endpoint that receives encrypted files. Reads use the gateway on the same host.', aliases: ['server', 'endpoint', 'kubo', 'rpc'], control: () => text('https://ipfs.prometheusags.ai', true) },
      { name: 'Pull name', desc: 'An IPNS key id. Accepts an /ipns/ prefix; /ipfs/<cid> pulls one explicit root.', aliases: ['ipns', 'key', 'target'], control: () => text('k51qzi5uqu5dl…abf4', true) },
      { name: 'Auto-publish interval', desc: 'Minutes between unattended publishes. The timer never opens a dialog; a locked vault skips with one notice per session.', aliases: ['timer', 'schedule', 'automatic', 'minutes'], control: () => dropdown(['Off', '5 minutes', '15 minutes', '30 minutes', '60 minutes'], '15 minutes') },
      { name: 'Chunk size for large files', desc: 'Files above 32 MB stream in chunks with an explicit offset so a phone can resume.', aliases: ['upload', 'stream', 'resume', 'large'], control: () => dropdown(['4 MB', '8 MB', '16 MB'], '8 MB') },
      { name: 'Staging retention', desc: 'How long partially published trees stay on the node before cleanup.', aliases: ['cleanup', 'staging', 'retention'], control: () => dropdown(['1 day', '7 days', '30 days'], '7 days') },
    ]},
    { id: 'security', label: 'Security', icon: 'i-shield', lede: 'Identity, pairing, grants and the vault key. Every action here shows its consequence before it runs.', rows: [
      { name: 'This device', desc: 'did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK · scan from another device to pair, or type the short code it shows.', aliases: ['did', 'identity', 'pair', 'pairing', 'qr', 'code'], control: () => { const w = el('div', 'ipfs-sync-row'); w.appendChild(qr()); const c = el('div'); c.appendChild(el('div', 'mono', 'Short code  4H7Q-9KPD')); const d = el('div', 'setting-item-description', 'Expires in 1:48'); c.appendChild(d); w.appendChild(c); return w; } },
      { name: 'Paired devices', desc: 'Devices that can publish or pull this vault. Revoking takes effect when the device’s grant expires.', aliases: ['devices', 'revoke', 'phone', 'laptop', 'remove device'], full: true, control: () => { const w = el('div'); w.appendChild(deviceCard('i-laptop', 'MacBook Pro', 'did:key:z6MkhaXgBZDvotDkL5257faiztiGiC2QtKLGpbnnEGta2doK', 'Published 11 min ago', true)); w.appendChild(deviceCard('i-phone', 'iPhone', 'did:key:z6MkpTHR8VNsBxYAAWHut2Geadd9jSwuBV8xRoAnwWsdvktH', 'Pulled yesterday 22:14', false)); w.appendChild(deviceCard('i-laptop', 'Studio iMac', 'did:key:z6MkfrQ3NDzPoUNVDAUxbV8ubiwCjhNhfZJ5JQiTbCQ5MyTB', 'Published 3 days ago', false)); return w; } },
      { name: 'Active grants', desc: 'UCAN delegations this device issued. Invocations expire in 5 minutes, delegations in 24 hours; no-expiry tokens are rejected.', aliases: ['ucan', 'grants', 'tokens', 'delegation', 'expiry'], full: true, control: () => { const w = el('div', 'ipfs-sync-card'); w.style.padding = '0'; w.appendChild(grantRow('vault/publish, vault/pull', '19 h 12 min', 'to iPhone · issued today 07:30')); w.appendChild(grantRow('vault/pull', '2 d 04 h', 'to Studio iMac · issued 2026-10-02')); return w; } },
      { name: 'Vault key', desc: 'Unlocked for this session. The key is held in memory only and is never written to plugin data.', aliases: ['lock', 'unlock', 'passphrase', 'key'], control: () => { const w = el('div', 'ipfs-sync-row'); const b = el('span', 'ipfs-sync-badge', 'unlocked'); b.dataset.tone = 'ok'; w.appendChild(b); w.appendChild(button('Lock now', null, () => { b.textContent = 'locked'; b.dataset.tone = ''; notice('Vault locked · the next publish asks for the passphrase'); })); return w; } },
      { name: 'Change the passphrase', desc: 'Generates a new passphrase and replaces this device’s key slot. The old passphrase and every old copy of the key-slot file keep opening the vault; this revokes nothing.', aliases: ['rekey', 'rotate', 'new passphrase'], control: () => button('Change…', null, () => dialog('Change the passphrase?', 'A new passphrase is generated and shown once. You type it again before anything is written.', ['Other devices must run “Accept changed key slots” with the new passphrase before they can pull or publish again.', 'The old passphrase and every old copy of keyslots.json still open the vault. A lost device needs a new vault, not a new passphrase.', 'Takes a few seconds and 64 MiB of memory; keep the app in the foreground.'], 'Continue', () => notice('Passphrase dialog would open here'))) },
      { name: 'Key-derivation cost', desc: 'This device’s slot: 64 MiB, 3 iterations (default). A higher cost slows an attacker and this phone equally.', aliases: ['argon2', 'argon2id', 'cost', 'memory', 'iterations'], control: () => dropdown(['Default · 64 MiB, 3', 'High · 128 MiB, 4'], 'Default · 64 MiB, 3') },
    ]},
    { id: 'agents', label: 'Agents', icon: 'i-cpu', lede: 'Which agents may run, where, and what they may touch.', rows: [
      { name: 'Default lane', desc: 'Order the agent tries when answering. Disconnected means local only; the chip in the chat shows the lane actually used.', aliases: ['local', 'remote', 'offline', 'routing', 'lane', 'model'], control: () => dropdown(['Local, then remote', 'Local only', 'Remote, then local'], 'Local, then remote') },
      { name: 'Remote endpoint', desc: 'An AG-UI endpoint (your UAR instance or any compatible server). Credentials live in the keychain, never here.', aliases: ['uar', 'ag-ui', 'server', 'endpoint', 'api'], control: () => text('https://uar.local:8443/ag-ui', true) },
      { name: 'Local generative model', desc: 'Small model for answers when offline. Embeddings always run locally regardless.', aliases: ['llm', 'webllm', 'onnx', 'model', 'offline'], control: () => dropdown(['None (search only)', 'Qwen2.5 1.5B · WebGPU', 'Llama 3.2 1B · WASM'], 'Qwen2.5 1.5B · WebGPU') },
      { name: 'Approve mutating tools', desc: 'Writes, moves and ipfs_add always show an approval card. Per-agent “always allow” is not offered in this version.', aliases: ['approval', 'permission', 'confirm', 'write', 'tools'], control: () => { const t = toggle(true); t.setAttribute('aria-disabled', 'true'); t.style.opacity = '0.6'; t.onclick = () => notice('Approval cards cannot be turned off in this version'); return t; } },
      { name: 'Skill permissions', desc: 'Skills referenced by CID are fetched once and cached. Each skill declares the paths and hosts it needs; deny-by-default outside them.', aliases: ['skills', 'wasm', 'capabilities', 'permissions', 'cid'], control: () => button('Review 3 skills…', null, () => notice('Skill list would open here')) },
    ]},
    { id: 'links', label: 'Direct links', icon: 'i-link', lede: 'Phone-to-desktop sync without the node in the middle.', rows: [
      { name: 'WebRTC pairing', desc: 'Direct link to a paired device on the same network or through the signaling relay.', aliases: ['webrtc', 'p2p', 'peer', 'direct'], control: () => toggle(true) },
      { name: 'iroh (preview)', desc: 'Experimental direct transport. Off by default until it has been run on a phone.', aliases: ['iroh', 'preview', 'experimental'], control: () => toggle(false) },
      { name: 'Signaling relay', desc: 'Used only to find the other device; no vault bytes pass through it.', aliases: ['relay', 'signaling', 'nat'], control: () => text('wss://relay.prometheusags.ai', true) },
    ]},
    { id: 'data', label: 'Data', icon: 'i-db', lede: 'Local stores are caches. The vault and its manifest on the node are the truth.', rows: [
      { name: 'Embedding model', desc: 'Runs on this device. Changing the model re-embeds every note; embeddings for the old model are discarded.', aliases: ['model', 'onnx', 'minilm', 'embeddings', 'vectors'], control: () => dropdown(['all-MiniLM-L6-v2 · 384', 'bge-small-en-v1.5 · 384', 'nomic-embed-text-v1.5 · 768'], 'all-MiniLM-L6-v2 · 384') },
      { name: 'Embed on battery', desc: 'Pause background embedding while unplugged. Manual “Embed changed” still runs.', aliases: ['battery', 'power', 'pause', 'background'], control: () => toggle(false) },
      { name: 'Vector store', desc: 'PGlite in IndexedDB · 14.8 MB · 1,204 vectors. Rebuildable from the vault at any time.', aliases: ['pglite', 'indexeddb', 'storage', 'size', 'vectors'], control: () => button('Rebuild index', 'warn', () => dialog('Rebuild the index on this device?', 'The local store is deleted and every note is embedded again. Search falls back to text until it finishes.', ['Estimated 2 to 4 minutes for 1,218 notes; keep the app in the foreground on a phone.', 'Nothing in the vault or on the node changes.', 'Conversations and settings are kept.'], 'Rebuild index', () => notice('Rebuilding index'))) },
      { name: 'Knowledge graph', desc: 'SurrealDB WASM · links, backlinks, tags and agent-inferred relations. 3,912 edges.', aliases: ['surreal', 'graph', 'relations', 'edges'], control: () => button('Rebuild graph', 'warn', () => dialog('Rebuild the graph?', 'Every note is parsed again for links and tags. Agent-inferred relations are replayed from their records.', ['Takes under a minute for 1,218 notes.', 'Nothing in the vault changes.'], 'Rebuild graph', () => notice('Rebuilding graph'))) },
      { name: 'Conversation history', desc: 'Kept on this device only. “Save as note” copies a conversation into the vault explicitly.', aliases: ['history', 'transcripts', 'chat', 'retention', 'delete'], control: () => button('Delete all…', 'warn', () => dialog('Delete all conversations on this device?', 'Conversations saved as notes stay in the vault. Everything else is gone.', ['42 conversations · 1.1 MB', 'Other devices keep their own history.'], 'Delete conversations', () => notice('Conversations deleted'))) },
      { name: 'Wipe local stores', desc: 'Removes vectors, graph, conversations and the pull record from this device. The vault files stay.', aliases: ['wipe', 'reset', 'clear', 'delete everything'], control: () => button('Wipe…', 'warn', () => dialog('Wipe local stores on this device?', 'The next pull treats this device as new: it asks you to confirm the sequence, date and device shown by the vault key holder.', ['Vault files in this folder are not touched.', 'Nothing on the node changes.', 'This cannot be undone, but everything here is rebuildable.'], 'Wipe local stores', () => notice('Local stores wiped'))) },
    ]},
    { id: 'appearance', label: 'Appearance', icon: 'i-eye', lede: 'Density and what the chat shows by default. Colours and fonts follow your Obsidian theme.', rows: [
      { name: 'Density', desc: 'Compact tightens rows in search results and the index list.', aliases: ['compact', 'spacing', 'size'], control: () => dropdown(['Comfortable', 'Compact'], 'Comfortable') },
      { name: 'Expand thinking while streaming', desc: 'Thinking sections open while the agent works and collapse when the turn ends.', aliases: ['thinking', 'collapse', 'expand', 'reasoning'], control: () => toggle(true) },
      { name: 'Expand tool calls while streaming', desc: 'Tool cards open while running, collapse when done. Errors stay open until you close them.', aliases: ['tools', 'collapse', 'expand'], control: () => toggle(true) },
      { name: 'Render mermaid diagrams', desc: 'Lazy-loaded on first use. On a phone, diagrams render on tap to save battery.', aliases: ['mermaid', 'diagram', 'render'], control: () => toggle(true) },
      { name: 'Render math', desc: 'KaTeX, loaded on first use.', aliases: ['katex', 'latex', 'math', 'formula'], control: () => toggle(false) },
      { name: 'Show status bar chip', desc: 'Index coverage and lane in the status bar. Click opens the Index tab.', aliases: ['status bar', 'chip', 'footer'], control: () => toggle(true) },
    ]},
  ];

  const nav = $('#nav'), host = $('#sections');
  const navBtns = new Map();
  sections.forEach((s, i) => {
    const b = el('button'); b.appendChild(icon(s.icon)); b.appendChild(el('span', null, s.label)); const hits = el('span', 'hits'); b.appendChild(hits); b.dataset.id = s.id; b.setAttribute('aria-current', String(i === 1)); b.addEventListener('click', () => { $$('button', nav).forEach(o => o.setAttribute('aria-current', 'false')); b.setAttribute('aria-current', 'true'); $('#cc-search').value = ''; filter(''); const target = $('#sec-' + s.id); $('#main').scrollTo({ top: target.offsetTop - 72, behavior: 'smooth' }); }); nav.appendChild(b); navBtns.set(s.id, hits);
    const sec = el('section'); sec.id = 'sec-' + s.id; sec.dataset.odId = 'section-' + s.id;
    const h = el('div', 'setting-item heading'); const hi = el('div', 'setting-item-info'); hi.appendChild(el('div', 'setting-item-name', s.label)); hi.appendChild(el('div', 'setting-item-description', s.lede)); h.appendChild(hi); sec.appendChild(h);
    s.rows.forEach(r => { const item = el('div', 'setting-item'); item.dataset.search = (r.name + ' ' + r.desc + ' ' + r.aliases.join(' ')).toLowerCase(); if (r.full) { item.style.flexDirection = 'column'; item.style.alignItems = 'stretch'; item.style.gap = '8px'; } const info = el('div', 'setting-item-info'); info.appendChild(el('div', 'setting-item-name', r.name)); info.appendChild(el('div', 'setting-item-description', r.desc)); item.appendChild(info); const ctl = el('div', 'setting-item-control'); if (r.full) ctl.style.display = 'block'; ctl.appendChild(r.control()); item.appendChild(ctl); sec.appendChild(item); });

  const filter = (q) => { q = q.trim().toLowerCase(); let any = false; sections.forEach(s => { const sec = $('#sec-' + s.id); let n = 0; $$('.setting-item:not(.heading)', sec).forEach(it => { const show = !q || it.dataset.search.includes(q); it.hidden = !show; if (show) n++; }); sec.hidden = q && n === 0; navBtns.get(s.id).textContent = q && n ? String(n) : ''; if (n) any = true; }); $('#nomatch').hidden = any; };
